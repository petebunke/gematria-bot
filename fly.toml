app = 'gematria-discord'
primary_region = 'iad'

[build]

[env]
  NODE_ENV = 'production'

# Discord bot needs to run continuously - no auto-stop
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
