services:
  - type: worker
    name: gematria-reply-bot
    runtime: node
    plan: free
    buildCommand: |
      npm install &&
      npx playwright install --with-deps chromium
    startCommand: node reply-bot.js
    envVars:
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/.cache/ms-playwright
