<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Image GIF Maker</title>
    <script src="https://unpkg.com/gif.js@0.2.0/dist/gif.js"></script>
    <script>
    // Fallback: try alternate CDN if GIF not defined after load
    window.addEventListener('load', function() {
        if (typeof GIF === 'undefined') {
            var s = document.createElement('script');
            s.src = 'https://cdn.jsdelivr.net/npm/gif.js@0.2.0/dist/gif.js';
            document.head.appendChild(s);
        }
    });
    </script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        h1 { text-align: center; color: #00d4ff; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #888; margin-bottom: 30px; }
        .status {
            background: #16213e;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #00d4ff;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 13px;
            max-height: 200px;
            overflow-y: auto;
        }
        .status.error { border-left-color: #ff4757; }
        .status.success { border-left-color: #2ed573; }
        .tables-container { display: flex; flex-direction: column; gap: 30px; }
        .table-section { background: #16213e; padding: 20px; border-radius: 12px; }
        .table-section h2 { color: #00d4ff; margin-top: 0; border-bottom: 1px solid #333; padding-bottom: 10px; }
        .columns-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .column-card { background: #0f0f23; padding: 15px; border-radius: 8px; text-align: center; }
        .column-card h3 { color: #ffd700; margin-top: 0; font-size: 14px; }
        .gif-preview { width: 100%; max-width: 300px; height: auto; border: 2px solid #333; border-radius: 4px; margin: 10px 0; }
        .placeholder { width: 200px; height: 200px; background: #222; display: flex; align-items: center; justify-content: center; margin: 10px auto; border-radius: 4px; color: #666; flex-direction: column; }
        .progress-bar { width: 100%; height: 20px; background: #333; border-radius: 10px; overflow: hidden; margin: 10px 0; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #00d4ff, #0066ff); transition: width 0.3s; }
        .download-btn {
            background: linear-gradient(135deg, #00d4ff, #0066ff);
            color: white; border: none; padding: 10px 20px; border-radius: 6px;
            cursor: pointer; font-weight: bold; transition: transform 0.2s, box-shadow 0.2s;
        }
        .download-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(0, 212, 255, 0.4); }
        .download-btn:disabled { background: #444; cursor: not-allowed; transform: none; box-shadow: none; }
        .image-count { color: #888; font-size: 12px; margin-bottom: 10px; }
        .loading-spinner {
            width: 40px; height: 40px; border: 4px solid #333; border-top-color: #00d4ff;
            border-radius: 50%; animation: spin 1s linear infinite; margin: 10px auto;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .start-btn { display: block; margin: 20px auto; padding: 15px 40px; font-size: 18px; background: linear-gradient(135deg, #2ed573, #17a558); }
        .controls { text-align: center; margin-bottom: 20px; }
        .speed-control { margin: 15px 0; }
        .speed-control label { color: #888; }
        .download-all-btn { background: linear-gradient(135deg, #ffd700, #ff8c00); margin-top: 20px; padding: 12px 30px; font-size: 16px; }
    </style>
</head>
<body>
    <h1>Table Image GIF Maker</h1>
    <p class="subtitle">Creates animated GIFs from table columns containing images on any webpage</p>

    <div class="controls">
        <div style="margin-bottom: 15px;">
            <label style="color: #888;">Page URL:</label><br>
            <input type="text" id="urlInput" value="https://en.wikipedia.org/wiki/List_of_Wenninger_polyhedron_models"
                   style="width: 100%; max-width: 600px; padding: 10px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff; margin-top: 5px;">
        </div>
        <div class="speed-control">
            <label>Animation Speed (ms per frame): <span id="speedValue">1</span></label><br>
            <input type="number" id="speedSlider" min="1" max="9999" value="1" style="width: 80px; padding: 5px; border-radius: 4px; border: 1px solid #444; background: #222; color: #fff;">
        </div>
        <button class="download-btn start-btn" id="startBtn" onclick="startProcess()">
            Start Processing
        </button>
    </div>

    <div id="status" class="status">Click "Start Processing" to fetch the Wikipedia page and generate animated GIFs.</div>

    <div id="tablesContainer" class="tables-container"></div>

    const GIF_WORKER_BLOB = new Blob([GIF_WORKER_CODE], { type: 'application/javascript' });
    const GIF_WORKER_URL = URL.createObjectURL(GIF_WORKER_BLOB);

    let frameDelay = 1;
    const allGifs = [];
    let logMessages = [];

    document.getElementById('speedSlider').addEventListener('input', (e) => {
        frameDelay = parseInt(e.target.value) || 1;
        document.getElementById('speedValue').textContent = frameDelay;
    });

    function log(message) {
        logMessages.push(message);
        if (logMessages.length > 20) logMessages.shift();
        document.getElementById('status').textContent = logMessages.join('\n');
        document.getElementById('status').scrollTop = document.getElementById('status').scrollHeight;
        console.log(message);
    }

    function setStatus(message, type = '') {
        logMessages = [message];
        const statusEl = document.getElementById('status');
        statusEl.textContent = message;
        statusEl.className = 'status ' + type;
    }

    async function startProcess() {
        const startBtn = document.getElementById('startBtn');
        startBtn.disabled = true;
        startBtn.textContent = 'Processing...';
        allGifs.length = 0;
        logMessages = [];

        log('Starting process...');

        try {
            const proxies = [
                { name: 'allorigins-get', url: 'https://api.allorigins.win/get?url=', isJson: true },
                { name: 'corsproxy', url: 'https://corsproxy.io/?' },
                { name: 'thingproxy', url: 'https://thingproxy.freeboard.io/fetch/' }
            ];

            const targetUrl = document.getElementById('urlInput').value.trim();
            if (!targetUrl) {
                throw new Error('Please enter a URL');
            }
            const baseUrl = new URL(targetUrl).origin;
            let html = null;

            for (const proxy of proxies) {
                try {
                    log(`Trying ${proxy.name}...`);
                    const fullUrl = proxy.url + encodeURIComponent(targetUrl);
                    const response = await fetch(fullUrl);
                    if (response.ok) {
                        if (proxy.isJson) {
                            const json = await response.json();
                            html = json.contents;
                        } else {
                            html = await response.text();
                        }
                        log(`Success with ${proxy.name}!`);
                        break;
                    } else {
                        log(`${proxy.name} returned ${response.status}`);
                    }
                } catch (e) {
                    log(`${proxy.name} failed: ${e.message}`);
                }
            }

            if (!html) {
                throw new Error('All CORS proxies failed. Check browser console for details.');
            }

            log('Parsing HTML...');
            const parser = new DOMParser();
            const doc = parser.parseFromString(html, 'text/html');

            let tables = doc.querySelectorAll('table.wikitable');
            if (tables.length === 0) {
                tables = doc.querySelectorAll('table');
            }
            log(`Found ${tables.length} tables`);

            const tablesContainer = document.getElementById('tablesContainer');
            tablesContainer.innerHTML = '';

            let tableIndex = 0;
            for (const table of tables) {
                const imageColumns = findImageColumns(table, baseUrl);
                const colCount = Object.keys(imageColumns).length;

                if (colCount > 0) {
                    tableIndex++;
                    log(`Table ${tableIndex}: ${colCount} image columns found`);
                    await processTable(table, imageColumns, tableIndex);
                }
            }

            if (tableIndex === 0) {
                setStatus('No tables with image columns found.', 'error');
            } else {
                log(`\nCompleted! Created ${allGifs.length} GIFs.`);
                document.getElementById('status').className = 'status success';

                if (allGifs.length > 1) {
                    const downloadAllBtn = document.createElement('button');
                    downloadAllBtn.className = 'download-btn download-all-btn';
                    downloadAllBtn.textContent = `Download All ${allGifs.length} GIFs`;
                    downloadAllBtn.onclick = downloadAllGifs;
                    tablesContainer.appendChild(downloadAllBtn);
                }
            }

        } catch (error) {
            log(`ERROR: ${error.message}`);
            document.getElementById('status').className = 'status error';
            console.error(error);
        }

        startBtn.disabled = false;
        startBtn.textContent = 'Start Processing';
    }

    function findImageColumns(table, baseUrl) {
        const rows = table.querySelectorAll('tr');
        const imageColumns = {};
        const headers = [];

        const headerRow = rows[0];
        if (headerRow) {
            headerRow.querySelectorAll('th, td').forEach((cell, idx) => {
                headers[idx] = cell.textContent.trim().substring(0, 30) || `Column ${idx + 1}`;
            });
        }

        for (let rowIdx = 0; rowIdx < rows.length; rowIdx++) {
            const cells = rows[rowIdx].querySelectorAll('td, th');
            let colIdx = 0;

            cells.forEach((cell) => {
                const imgs = cell.querySelectorAll('img');
                imgs.forEach(img => {
                    let src = img.getAttribute('src') || '';

                    if (src.startsWith('//')) src = 'https:' + src;
                    else if (src.startsWith('/')) src = baseUrl + src;

                    // For Wikipedia, get full resolution
                    if (src.includes('wikipedia') || src.includes('wikimedia')) {
                        src = src.replace(/\/\d+px-/, '/800px-');
                    }

                    if (src.match(/\.(png|jpg|jpeg|gif|svg)/i)) {
                        if (!imageColumns[colIdx]) {
                            imageColumns[colIdx] = { name: headers[colIdx] || `Col ${colIdx + 1}`, images: [] };
                        }
                        if (!imageColumns[colIdx].images.includes(src)) {
                            imageColumns[colIdx].images.push(src);
                        }
                    }
                });

                const colspan = parseInt(cell.getAttribute('colspan')) || 1;
                colIdx += colspan;
            });
        }

        const filtered = {};
        for (const [col, data] of Object.entries(imageColumns)) {
            if (data.images.length >= 2) {
                filtered[col] = data;
            }
        }
        return filtered;
    }

    async function processTable(table, imageColumns, tableIndex) {
        const container = document.getElementById('tablesContainer');
        const caption = table.querySelector('caption');
        const tableName = caption?.textContent.trim() || `Table ${tableIndex}`;

        const section = document.createElement('div');
        section.className = 'table-section';
        section.innerHTML = `<h2>${tableName}</h2><div class="columns-grid" id="table${tableIndex}Grid"></div>`;
        container.appendChild(section);

        const grid = section.querySelector('.columns-grid');

        for (const [colIdx, colData] of Object.entries(imageColumns)) {
            await processColumn(colData, tableIndex, colIdx, grid);
        }
    }

    async function processColumn(colData, tableIndex, colIdx, grid) {
        const card = document.createElement('div');
        card.className = 'column-card';
        card.innerHTML = `
            <h3>${colData.name}</h3>
            <div class="image-count">${colData.images.length} images</div>
            <div class="placeholder" id="preview_${tableIndex}_${colIdx}">
                <div class="loading-spinner"></div>
                <small>Loading images...</small>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progress_${tableIndex}_${colIdx}" style="width: 0%"></div>
            </div>
            <button class="download-btn" id="btn_${tableIndex}_${colIdx}" disabled>Loading...</button>
        `;
        grid.appendChild(card);

        try {
            const gifBlob = await createGifFromImages(colData.images, tableIndex, colIdx);

            const previewEl = document.getElementById(`preview_${tableIndex}_${colIdx}`);
            const btnEl = document.getElementById(`btn_${tableIndex}_${colIdx}`);
            const gifUrl = URL.createObjectURL(gifBlob);

            previewEl.outerHTML = `<img src="${gifUrl}" class="gif-preview" alt="Animated GIF">`;
            btnEl.textContent = 'Download GIF';
            btnEl.disabled = false;

            const fileName = `wenninger_t${tableIndex}_${colData.name.replace(/[^a-z0-9]/gi, '_')}.gif`;
            btnEl.onclick = () => {
                const a = document.createElement('a');
                a.href = gifUrl;
                a.download = fileName;
                a.click();
            };

            allGifs.push({ blob: gifBlob, name: fileName });
            log(`Created GIF: ${fileName}`);

        } catch (error) {
            console.error('GIF creation error:', error);
            const previewEl = document.getElementById(`preview_${tableIndex}_${colIdx}`);
            const btnEl = document.getElementById(`btn_${tableIndex}_${colIdx}`);
            if (previewEl) previewEl.innerHTML = `<span style="color: #ff4757; font-size: 12px;">Error: ${error.message}</span>`;
            if (btnEl) btnEl.textContent = 'Failed';
        }
    }

    async function createGifFromImages(imageUrls, tableIndex, colIdx) {
        const progressEl = document.getElementById(`progress_${tableIndex}_${colIdx}`);
        const previewEl = document.getElementById(`preview_${tableIndex}_${colIdx}`);

        const images = [];
        let loaded = 0;

        for (const url of imageUrls) {
            try {
                if (previewEl) {
                    const small = previewEl.querySelector('small');
                    if (small) small.textContent = `Loading ${loaded + 1}/${imageUrls.length}...`;
                }
                const img = await loadImage(url);
                images.push(img);
            } catch (e) {
                console.warn('Failed to load:', url, e);
            }
            loaded++;
            if (progressEl) progressEl.style.width = `${(loaded / imageUrls.length) * 40}%`;
        }

        if (images.length < 2) {
            throw new Error(`Only ${images.length} images loaded`);
        }

        // Use full resolution - find max dimensions
        let maxWidth = 0, maxHeight = 0;
        for (const img of images) {
            maxWidth = Math.max(maxWidth, img.width);
            maxHeight = Math.max(maxHeight, img.height);
        }

        if (previewEl) {
            const small = previewEl.querySelector('small');
            if (small) small.textContent = 'Encoding GIF...';
        }

        // Build ping-pong sequence
        const pingPongSequence = [];
        for (let i = 0; i < images.length; i++) {
            pingPongSequence.push(i);
        }
        for (let i = images.length - 2; i > 0; i--) {
            pingPongSequence.push(i);
        }

        // Create GIF using gif.js for full color support
        return new Promise((resolve, reject) => {
            if (typeof GIF === 'undefined') {
                reject(new Error('GIF library not loaded. Try refreshing the page.'));
                return;
            }
            const gif = new GIF({
                workers: 2,
                quality: 10,
                width: maxWidth,
                height: maxHeight,
                workerScript: GIF_WORKER_URL
            });

            const canvas = document.createElement('canvas');
            canvas.width = maxWidth;
            canvas.height = maxHeight;
            const ctx = canvas.getContext('2d');

            const totalFrames = pingPongSequence.length;
            for (let f = 0; f < totalFrames; f++) {
                const img = images[pingPongSequence[f]];
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, maxWidth, maxHeight);

                // Center image at full size
                const x = (maxWidth - img.width) / 2;
                const y = (maxHeight - img.height) / 2;
                ctx.drawImage(img, x, y);

                gif.addFrame(ctx, { copy: true, delay: frameDelay });
            }

            gif.on('progress', (p) => {
                if (progressEl) progressEl.style.width = `${40 + p * 60}%`;
            });

            gif.on('finished', (blob) => {
                if (progressEl) progressEl.style.width = '100%';
                resolve(blob);
            });

            gif.on('error', reject);

            gif.render();
        });
    }

    async function loadImage(url) {
        const proxies = [
            (u) => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u),
            (u) => 'https://corsproxy.io/?' + encodeURIComponent(u),
            (u) => 'https://thingproxy.freeboard.io/fetch/' + u,
            (u) => u
        ];

        for (const proxyFn of proxies) {
            try {
                const proxiedUrl = proxyFn(url);
                const img = await new Promise((resolve, reject) => {
                    const image = new Image();
                    image.crossOrigin = 'anonymous';
                    image.onload = () => resolve(image);
                    image.onerror = reject;
                    setTimeout(() => reject(new Error('Timeout')), 15000);
                    image.src = proxiedUrl;
                });
                return img;
            } catch (e) {
                continue;
            }
        }
        throw new Error('All image load attempts failed');
    }

    function downloadAllGifs() {
        allGifs.forEach((gif, idx) => {
            setTimeout(() => {
                const a = document.createElement('a');
                a.href = URL.createObjectURL(gif.blob);
                a.download = gif.name;
                a.click();
            }, idx * 300);
        });
    }
    </script>
